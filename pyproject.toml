[project]
name = "content-security-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=40,<41",
    "fastapi[standard]>=0.128.8",
    "httpx>=0.28,<0.29",
    "langchain-core>=0.3.86",
    "langgraph>=0.6.11",
    "openai>=1.55",
    "pymysql>=1.1,<2",
    "torch>=2.7,<3",
    "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
