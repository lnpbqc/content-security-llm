<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3-8B 对话</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e8ee; --dim:#9aa3b2; --accent:#4f8cff; --user:#22304a; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg); display:flex; flex-direction:column;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  details.cfg{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
  details.cfg summary{cursor:pointer;color:var(--dim);font-size:13px;outline:none}
  details.cfg summary b{color:var(--fg)}
  .grid{display:grid;grid-template-columns:2fr 2fr 1.4fr 90px 90px 96px;gap:10px;margin-top:10px}
  .grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
  input,textarea,button,select{
    background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:7px 9px;font:inherit;outline:none;
  }
  input:focus,textarea:focus{border-color:var(--accent)}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  #chat{flex:1;overflow-y:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:14px}
  .wrap{max-width:860px;width:100%;margin:0 auto;display:flex}
  .wrap.u{justify-content:flex-end}
  .bub{padding:10px 14px;border-radius:12px;max-width:88%;overflow-wrap:anywhere;white-space:normal}
  .u .bub{background:var(--user);border:1px solid #2c3f63}
  .a .bub{background:var(--panel);border:1px solid var(--line)}
  .bub.err{border-color:var(--err);color:var(--err);white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .bub pre{background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;margin:8px 0}
  .bub code{background:#0b0d11;border-radius:4px;padding:1px 5px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .bub pre code{background:none;padding:0}
  .bub h1,.bub h2,.bub h3{margin:10px 0 4px;line-height:1.3}
  .bub h1{font-size:17px}.bub h2{font-size:16px}.bub h3{font-size:15px}
  .bub p{margin:6px 0}
  .bub ul{margin:6px 0;padding-left:20px}
  .bub a{color:var(--accent)}
  /* 思考过程折叠块：比正文暗、字号略小，纯文本容器，不经过 md() */
  .bub .ans{white-space:normal}
  .bub details.think{margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:#12151c}
  .bub details.think summary{cursor:pointer;outline:none;padding:5px 10px;font-size:12px;color:var(--dim)}
  .bub details.think[open] summary{border-bottom:1px solid var(--line)}
  .bub details.think .think-body{
    padding:6px 10px 8px;font-size:12.5px;line-height:1.55;color:#8b94a3;
    white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow-y:auto;
    font-family:ui-monospace,Consolas,monospace;
  }
  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px 16px}
  .composer{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  #input{flex:1;resize:none;min-height:46px;max-height:180px;line-height:1.5}
  #send{min-width:74px;height:46px;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  #stop{height:46px;display:none}
  .hint{max-width:860px;margin:8px auto 0;color:var(--dim);font-size:12px;display:flex;justify-content:space-between}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim);margin-right:6px}
  .dot.ok{background:#3ddc84}.dot.bad{background:var(--err)}
</style>
</head>
<body>

<details class="cfg">
  <summary>连接设置　<span class="dot" id="dot"></span><b id="cfginfo">未配置</b></summary>
  <div class="grid">
    <label>服务地址（平台给的外网地址）
      <input id="base" placeholder="https://a21337217859973120620205-secuplat2web.svc.bitahub.com:20443/" value="https://a21337217859973120620205-secuplat2web.svc.bitahub.com:20443/">
    </label>
    <label>API Key
      <input id="key" type="password" placeholder="启动时 --api-keys 设的那个" value="gzhu-yyds">
    </label>
    <label>模型名
      <input id="model" placeholder="/data/models/Qwen3-8B" value="/data/models/Qwen3-8B">
    </label>
    <label>temperature
      <input id="temp" type="number" step="0.1" min="0" max="2" value="0.6">
    </label>
    <label>top_p
      <input id="topp" type="number" step="0.05" min="0" max="1" value="0.95">
    </label>
    <label>max_tokens
      <input id="maxtok" type="number" step="128" min="1" value="8192">
    </label>
  </div>
  <div class="grid" style="grid-template-columns:1fr 150px 120px 120px 120px">
    <!-- System Prompt 默认值来源核实：官方 Qwen3-8B 的 chat_template
         （https://modelscope.cn/models/Qwen/Qwen3-8B/resolve/master/tokenizer_config.json）
         里没有内置的默认 system 文本 —— messages[0] 不是 system 时模板不插入任何 system 块。
         这里填的 "You are Qwen, created by Alibaba Cloud. You are a helpful assistant."
         是 Qwen 系列的惯用默认值，作为推荐起点；清空这个输入框则完全不发 system 消息。 -->
    <label>System Prompt
      <input id="sys" value="You are Qwen, created by Alibaba Cloud. You are a helpful assistant.">
    </label>
    <label>思考模式
      <select id="think">
        <option value="1" selected>开启思考</option>
        <option value="0">关闭思考</option>
      </select>
    </label>
    <label>&nbsp;<button id="ping" style="height:36px">测试连接</button></label>
    <label>&nbsp;<button id="clear" style="height:36px">清空对话</button></label>
    <label>&nbsp;<button id="save" style="height:36px">保存设置</button></label>
  </div>
</details>

<div id="chat"></div>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="stop">停止</button>
    <button id="send">发送</button>
  </div>
  <div class="hint">
    <span id="status">就绪　qwen3web:1222</span>
    <span id="usage"></span>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat');
let messages = [];      // 会话上下文
let ctrl = null;        // 用于打断流式

/* 模型名兜底：LMDeploy 的 /v1/models 返回的 id 就是模型目录路径，所以 model 字段直接填路径 */
const MODEL_FALLBACK = '/data/models/Qwen3-8B';

/* ---------- 设置持久化 ---------- */
const FIELDS = ['base','key','model','temp','topp','maxtok','sys','think'];
function loadCfg(){
  const s = JSON.parse(localStorage.getItem('qwen-cfg') || '{}');
  for (const f of FIELDS) if (s[f] !== undefined) $(f).value = s[f];
  if (!$('model').value) $('model').value = MODEL_FALLBACK;
  if (!$('topp').value) $('topp').value = '0.95';
  paint();
}
function saveCfg(){
  const s = {};
  for (const f of FIELDS) s[f] = $(f).value;
  localStorage.setItem('qwen-cfg', JSON.stringify(s));
  paint();
  setStatus('设置已保存到本机浏览器');
}
function paint(){
  const b = $('base').value.trim();
  const ok = /^https?:\/\//.test(b) && $('key').value.trim();
  $('dot').className = 'dot ' + (ok ? 'ok' : 'bad');
  $('cfginfo').textContent = ok ? b : '未配置';
}

/* ---------- 端点拼接 ---------- */
function endpoint(path){
  let b = $('base').value.trim().replace(/\/+$/,'');
  if (!b) throw new Error('请先填服务地址');
  if (!/\/v1$/.test(b)) b += '/v1';
  return b + path;
}
function headers(){
  return { 'Content-Type':'application/json', 'Authorization':'Bearer ' + $('key').value.trim() };
}
function setStatus(t){ $('status').textContent = t; }

/* ---------- 极简 Markdown 渲染（无外部依赖） ---------- */
function esc(s){
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function md(src){
  const blocks = [], inls = [];
  let h = esc(src);
  h = h.replace(/```[^\n]*\n([\s\S]*?)```/g, (m, code) => {
    blocks.push(code.replace(/\n$/,''));
    return '\u0000B' + (blocks.length-1) + '\u0000';
  });
  h = h.replace(/`([^`\n]+)`/g, (m, code) => {
    inls.push(code);
    return '\u0000I' + (inls.length-1) + '\u0000';
  });
  h = h.replace(/^### (.*)$/gm,'<h3>$1</h3>')
       .replace(/^## (.*)$/gm,'<h2>$1</h2>')
       .replace(/^# (.*)$/gm,'<h1>$1</h1>')
       .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
       .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/^[ \t]*[-*] (.*)$/gm,'<li>$1</li>');
  h = h.replace(/(?:<li>[\s\S]*?<\/li>\s*)+/g, m => '<ul>' + m + '</ul>');
  // 段落包装：按代码块占位符切段，只包装纯文本段
  h = h.split(/(\u0000B\d+\u0000)/).map(seg => {
    if (/^\u0000B\d+\u0000$/.test(seg)) return seg;
    const t = seg.trim();
    if (!t) return '';
    if (/^<(h[1-3]|ul|pre|li)/.test(t)) return t;
    return '<p>' + t.replace(/\n/g,'<br>') + '</p>';
  }).join('');
  h = h.replace(/\u0000I(\d+)\u0000/g, (m,i) => '<code>' + inls[i] + '</code>');
  h = h.replace(/\u0000B(\d+)\u0000/g, (m,i) => '<pre><code>' + blocks[i] + '</code></pre>');
  return h;
}

/* ---------- 气泡 ---------- */
function bubble(role, text){
  const wrap = document.createElement('div');
  wrap.className = 'wrap ' + (role === 'user' ? 'u' : 'a');
  const b = document.createElement('div');
  b.className = 'bub';
  b.innerHTML = role === 'user' ? esc(text).replace(/\n/g,'<br>') : md(text);
  wrap.appendChild(b);
  chat.appendChild(wrap);
  scrollDown();
  return b;
}
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

/* 助手气泡：一个气泡里两个容器 —— 上面是思考过程 <details>（默认折叠），下面是正文。
   两个容器在创建时就按固定顺序 append 好，先出思考还是先出正文都不会错位；
   思考内容走独立的 .think-body 纯文本容器，不经过 md()，不污染正文渲染结果。 */
function assistantBubble(){
  const wrap = document.createElement('div');
  wrap.className = 'wrap a';
  const b = document.createElement('div');
  b.className = 'bub';
  const think = document.createElement('details');
  think.className = 'think';
  think.style.display = 'none';          // 服务端没开 --reasoning-parser 就完全不显示
  const sum = document.createElement('summary');
  const tbody = document.createElement('div');
  tbody.className = 'think-body';
  think.append(sum, tbody);
  const ans = document.createElement('div');
  ans.className = 'ans';
  b.append(think, ans);
  wrap.appendChild(b);
  chat.appendChild(wrap);
  scrollDown();
  return { bub:b, think:think, sum:sum, tbody:tbody, ans:ans };
}

/* ---------- 思考模式 / 采样参数 ---------- */
/* Qwen3-8B 官方推荐采样参数（模型卡 Best Practices，以及 enable_thinking=True/False 两节）：
     思考模式   Temperature=0.6, TopP=0.95
     非思考模式 Temperature=0.7, TopP=0.8
   官方同时提了 TopK=20、MinP=0，但 OpenAI 协议里没有这两个字段（透传是否生效没验证过），
   所以不加输入框、也不往请求体里塞。 */
const PRESET = {
  '1': { temp:'0.6', topp:'0.95', maxtok:'32768' },  // 官方思考档；思考段本身也占输出 token
  '0': { temp:'0.7', topp:'0.8',   maxtok:'8192'  }   // 官方非思考档
};
function applyPreset(){
  const on = $('think').value === '1';
  const p = PRESET[on ? '1' : '0'];
  $('temp').value = p.temp;
  $('topp').value = p.topp;
  $('maxtok').value = p.maxtok;
  setStatus('已套用 Qwen3 ' + (on ? '思考' : '非思考') + '模式推荐参数：temperature ' + p.temp +
            '，top_p ' + p.topp + '，max_tokens ' + p.maxtok);
}

/* ---------- 发送 ---------- */
async function send(){
  const text = $('input').value.trim();
  if (!text) return;
  if (!$('base').value.trim()) { $('base').focus(); return; }

  $('input').value = '';
  autoGrow();
  bubble('user', text);
  messages.push({ role:'user', content:text });

  /* system 消息只在填了内容时才发：Qwen3 的 chat template 在没有 system 消息时
     不会插入 system 块，但发一个 content 为空串的 system 消息会留下一个空的 system 段。 */
  /* 用 Number.isFinite 判空，别用 `parseFloat(x) || 默认值`：
     那样 temperature 填 0 会被当成"没填"悄悄改成 0.6，用户填的值和他拿到的行为不一致。 */
  const num = (v, d) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
  const sysText = $('sys').value.trim();
  const payload = {
    model: $('model').value.trim() || MODEL_FALLBACK,
    messages: sysText ? [{ role:'system', content: sysText }, ...messages] : [...messages],
    temperature: num($('temp').value, 0.6),
    top_p: num($('topp').value, 0.95),
    max_tokens: Math.max(1, Math.round(num($('maxtok').value, 8192))),
    stream: true,
    // Qwen3 的思考开关就是 chat template 里的 enable_thinking 参数。
    // 依据：LMDeploy 官方 Reasoning Outputs 文档（https://lmdeploy.readthedocs.io/zh-cn/latest/llm/api_server_reasoning.html）
    // 说明 OpenAI 兼容请求体可用 chat_template_kwargs 透传模板参数；
    // Qwen3-8B 官方 chat_template 里即 {%- if enable_thinking is defined and enable_thinking is false %}。
    chat_template_kwargs: { enable_thinking: $('think').value === '1' }
  };

  const out = assistantBubble();
  out.ans.textContent = '…';
  let acc = '', rsn = '', first = true, note = '';
  ctrl = new AbortController();
  $('send').disabled = true; $('stop').style.display = 'block';
  $('usage').textContent = '';   // 每轮清空：否则服务端不回 usage 时，tok/s 会用上一轮的数字算
  setStatus('生成中');
  const t0 = performance.now();
  const st = t => setStatus(note ? t + '　·　' + note : t);
  const markFirst = () => {
    if (!first) return;
    first = false;
    st('首字 ' + ((performance.now()-t0)/1000).toFixed(2) + 's');
  };

  try{
    const url = endpoint('/chat/completions');
    const opts = () => ({ method:'POST', headers: headers(), body: JSON.stringify(payload), signal: ctrl.signal });
    let res = await fetch(url, opts());
    let firstErr = '';
    if (res.status === 400){
      // 400 可能是服务端不认 chat_template_kwargs（老版 LMDeploy），也可能是别的原因
      // （超 session-len、参数非法……）。这里去掉该字段重试一次，只重试一次、不做循环，
      // 并把第一次的错误体留着——重试要是也失败，两个错误一起给用户，别让人只看到第二个。
      firstErr = (await res.text()).slice(0, 400);
      delete payload.chat_template_kwargs;
      note = '服务端返回 400，已去掉思考开关重试（本次按服务端默认思考设置生成）';
      setStatus(note);
      res = await fetch(url, opts());
    }
    if (!res.ok){
      const body = await res.text();
      throw new Error('HTTP ' + res.status + '\n' + body.slice(0, 800) +
        (firstErr ? '\n\n（去掉 chat_template_kwargs 重试之前的响应：HTTP 400\n' + firstErr + '）' : ''));
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines){
        const s = line.trim();
        if (!s.startsWith('data:')) continue;
        const data = s.slice(5).trim();
        if (data === '[DONE]') continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        const d = j.choices && j.choices[0] && j.choices[0].delta;
        // 思考内容：LMDeploy --reasoning-parser 把 <think> 里的内容拆到 reasoning_content
        if (d && d.reasoning_content){
          markFirst();
          rsn += d.reasoning_content;
          out.think.style.display = '';
          out.sum.textContent = '思考过程 · ' + rsn.length + ' 字';
          out.tbody.textContent = rsn;      // 纯文本，不走 md()
          scrollDown();
        }
        // 正文：照旧实时流式渲染 Markdown
        if (d && d.content){
          markFirst();
          acc += d.content;
          out.ans.innerHTML = md(acc);
          scrollDown();
        }
        if (j.usage){
          $('usage').textContent = 'prompt ' + j.usage.prompt_tokens + ' / completion ' + j.usage.completion_tokens;
        }
      }
    }
    const dt = (performance.now()-t0)/1000;
    if (!acc && !rsn){
      out.ans.textContent = '(模型没有返回内容)';
      st('完成　' + dt.toFixed(1) + 's');
    } else {
      const tok = $('usage').textContent.match(/completion (\d+)/);
      const tps = tok ? (tok[1]/dt).toFixed(1) : '—';
      st('完成　' + dt.toFixed(1) + 's　' + tps + ' tok/s');
      if (!acc) out.ans.textContent = '(模型没有返回正文)';
      // 多轮上下文只推进正文，reasoning 绝不进 messages：Qwen3 官方模型卡 Best Practices
      // 第 4 条 “No Thinking Content in History” 明确要求历史里只保留最终输出，
      // 把思考内容推进去既费 token 又可能干扰后续轮次。
      if (acc) messages.push({ role:'assistant', content: acc });
    }
  } catch (e){
    if (e.name === 'AbortError'){
      if (acc) messages.push({ role:'assistant', content: acc });   // 同样只进正文
      else messages.pop();   // 一个字都没出就中止：把这轮的 user 消息也撤掉，别留个悬空的轮次
      setStatus('已停止');
    } else {
      out.bub.className = 'bub err';
      out.bub.textContent = String(e.message || e);
      setStatus('失败');
      messages.pop();   // 失败的这轮不进上下文
    }
  } finally {
    ctrl = null;
    $('send').disabled = false; $('stop').style.display = 'none';
  }
}

/* ---------- 测试连接 ---------- */
async function ping(){
  const btn = $('ping');
  btn.disabled = true; setStatus('测试中…');
  try{
    const res = await fetch(endpoint('/models'), { headers: headers() });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0,300));
    const j = await res.json();
    const ids = (j.data || []).map(m => m.id);
    setStatus('连接正常');
    alert('连接成功\n\n可用模型：\n' + (ids.join('\n') || '(未返回模型列表)') +
          '\n\n如果这里显示的模型名和上面填的不一样，请改成：' + (ids[0] || '') +
          '\n\n思考内容是靠服务端的 --reasoning-parser default 拆到 reasoning_content 字段的；' +
          '如果开了思考却看不到「思考过程」，检查 qwen3web 的启动参数里有没有 --reasoning-parser。');
    if (ids[0] && !$('model').value.trim()) { $('model').value = ids[0]; saveCfg(); }
  } catch (e){
    setStatus('连接失败');
    alert('连接失败：\n\n' + (e.message || e) +
      '\n\n排查顺序：\n1. 服务地址是否和平台控制台复制的一致\n' +
      '2. LMDeploy 的 qwen3web 服务是否在跑（端口 1222）：ss -lntp | grep 1222，或 ./start-qwen.sh status\n' +
      '3. 是否绑的 0.0.0.0 而不是 127.0.0.1\n4. API Key 是否和 --api-keys 一致\n' +
      '5. 浏览器控制台看是否有 CORS 报错');
  } finally { btn.disabled = false; }
}

/* ---------- 其他交互 ---------- */
function autoGrow(){ const el = $('input'); el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 180) + 'px'; }

$('send').onclick = send;
$('stop').onclick = () => { if (ctrl) ctrl.abort(); };
$('ping').onclick = ping;
$('save').onclick = saveCfg;
$('clear').onclick = () => { messages = []; chat.innerHTML = ''; $('usage').textContent = ''; setStatus('已清空'); };
$('input').addEventListener('input', autoGrow);
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
for (const f of FIELDS) $(f).addEventListener('change', paint);
$('think').addEventListener('change', applyPreset);   // 切换思考开关时自动套用官方推荐采样参数

loadCfg();
</script>
</body>
</html>
